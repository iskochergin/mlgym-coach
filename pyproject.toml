[project]
name = "mlgym-coach"
version = "0.0.1"
description = "Gym for benchmarking LLM agents on tabular ML tasks."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]
